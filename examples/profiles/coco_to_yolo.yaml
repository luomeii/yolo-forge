# COCO JSON → YOLO 转换
# COCO instances.json → YOLO format conversion
#
# COCO 把所有标注放在一个 JSON 里, 我们按 image_id 关联到图片文件名.
# COCO stores all annotations in a single JSON; we match by image_id to filename.

name: coco_to_yolo
description: Convert COCO instances.json annotations to YOLO format.

output_dir: ./yolo_output
# 这里只列前 9 类做示例, 实际用的时候补全 80 类
# Listing first 9 classes as example; fill in all 80 for real use.
classes: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat]

train_split: 1.0
val_split: 0.0
test_split: 0.0

sources:
  - name: coco_train
    path: ./coco
    images_subdir: train2017
    labels_subdir: annotations
    label_format: coco
    coco_json: instances_train2017.json   # 相对 source.path / relative to source.path
    # COCO 按类别名匹配
    class_mappings:
      - {source_name: person,     target_id: 0}
      - {source_name: bicycle,    target_id: 1}
      - {source_name: car,        target_id: 2}
      - {source_name: motorcycle, target_id: 3}
      - {source_name: airplane,   target_id: 4}
      - {source_name: bus,        target_id: 5}
      - {source_name: train,      target_id: 6}
      - {source_name: truck,      target_id: 7}
      - {source_name: boat,       target_id: 8}
    background: skip
